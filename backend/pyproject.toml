[project]
name = "personal-knowledge-ai-backend"
version = "0.1.0"
description = "V1 backend for the Personal Knowledge AI Workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.18",
  "pgvector>=0.3.0",
  "boto3>=1.34",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "httpx>=0.27",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
