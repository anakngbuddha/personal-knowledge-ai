# Free-tier deployment blueprint
services:
  - type: web
    name: personal-knowledge-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_MODE
        value: jwt
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOW_LEGACY_TOKEN_ENDPOINT
        value: "false"
      - key: RLS_DEFAULT_DENY
        value: "true"
      - key: DEFAULT_ORG_SLUG
        value: default
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_GENERATION_MODEL
        value: gemini-2.5-flash
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKFLOW_WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKFLOW_WORKER_CONCURRENCY
        value: "1"
      - key: MALWARE_SCANNER
        value: heuristic
      - key: OCR_PROVIDER
        value: gemini
      - key: AUTO_APPROVE_UPLOADS
        value: "true"
      # The product list starts empty in production. The sample catalog is a demo.
      - key: DEMO_SEED_CATALOG
        value: "false"
      - key: GRAPH_EXTRACTION_ENABLED
        value: "true"
      - key: GRAPH_EXPANSION_ENABLED
        value: "true"
      - key: GEMINI_RPM
        value: "10"
      - key: URL_FETCH_ENABLED
        value: "true"
      - key: URL_FETCH_ALLOW_PRIVATE_IPS
        value: "false"
