# Free-tier deployment blueprint
services:
  - type: web
    name: personal-knowledge-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: AUTO_MIGRATE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_MODE
        value: jwt
      # Must be random, 32+ characters. Startup refuses empty, placeholder or
      # low-entropy values: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOW_LEGACY_TOKEN_ENDPOINT
        value: "false"
      # Self-service signup creates a new organization for anyone on the internet.
      # Set to "false" once your organization exists; invite people from the admin page.
      - key: SIGNUP_ENABLED
        value: "true"
      - key: AUTH_RATE_LIMIT_ENABLED
        value: "true"
      - key: PASSWORD_PBKDF2_ITERATIONS
        value: "600000"
      # Render's proxy appends the client address to X-Forwarded-For; trust one hop
      # so per-IP auth throttling sees real clients instead of the proxy.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: RLS_DEFAULT_DENY
        value: "true"
      # Production requires RLS; DATABASE_URL must use a NOBYPASSRLS role.
      # Migrations run separately with the administrator connection.
      - key: RLS_REQUIRED
        value: "true"
      - key: TAVILY_API_KEY
        sync: false
      - key: DEFAULT_ORG_SLUG
        value: default
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_GENERATION_MODEL
        value: gemini-2.5-flash
      - key: MCP_ENABLED
        value: "true"
      - key: MCP_CREDENTIALS_KEY
        sync: false
      - key: WORKER_ENABLED
        value: "true"
      - key: FRESHNESS_WORKER_ENABLED
        value: "false"
      - key: WORKFLOW_WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKFLOW_WORKER_CONCURRENCY
        value: "1"
      - key: MALWARE_SCANNER
        value: clamav
      - key: OCR_PROVIDER
        value: gemini
      - key: AUTO_APPROVE_UPLOADS
        value: "false"
      # The product list starts empty in production. The sample catalog is a demo.
      - key: DEMO_SEED_CATALOG
        value: "false"
      - key: GRAPH_EXTRACTION_ENABLED
        value: "true"
      - key: GRAPH_EXPANSION_ENABLED
        value: "true"
      - key: GEMINI_RPM
        value: "10"
      - key: URL_FETCH_ENABLED
        value: "true"
      - key: URL_FETCH_ALLOW_PRIVATE_IPS
        value: "false"

      # Configure the ClamAV host/port before enabling ingestion in production.
      # Crawls always honor robots.txt; there is no bypass setting.
