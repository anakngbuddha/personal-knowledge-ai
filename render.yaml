# Free-tier Blueprint. `plan` MUST be `free`.
# Omitting it defaults to `starter` (paid) and Render will refuse the Blueprint
# unless a payment method is on file.
#
# Dashboard → New → Blueprint → this repo.
# You will be prompted for every `sync: false` secret below.
#
# After the first deploy, run schema setup once against Aiven from your laptop:
#   cd backend
#   python ../scripts/init_db.py
# (set DATABASE_URL first: postgresql+psycopg://USER:PASS@HOST:PORT/DB?sslmode=require)

services:
  - type: web
    name: personal-knowledge-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Aiven URI: rewrite postgres:// or postgresql:// → postgresql+psycopg://
      # and keep ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: AUTH_MODE
        value: owner_dev
      - key: JWT_SECRET_KEY
        sync: false
      - key: DEFAULT_ORG_SLUG
        value: default

      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "768"
      - key: GEMINI_GENERATION_MODEL
        value: gemini-2.5-flash

      - key: WORKER_ENABLED
        value: "true"
      - key: WORKFLOW_WORKER_ENABLED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: WORKFLOW_WORKER_CONCURRENCY
        value: "1"

      - key: MALWARE_SCANNER
        value: heuristic
      - key: OCR_PROVIDER
        value: none
      - key: URL_FETCH_ENABLED
        value: "true"
      - key: URL_FETCH_ALLOW_PRIVATE_IPS
        value: "false"
