name: Tests and Security Gates
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pka_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/pka_test
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      STORAGE_BACKEND: local
      AUTH_MODE: owner_dev
      RLS_DEFAULT_DENY: "true"
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r backend/requirements.lock
          pip install --require-hashes -r backend/requirements-dev.lock
      - name: Migrate disposable database
        working-directory: backend
        run: python ../scripts/init_db.py
      - name: Verify restricted runtime role
        working-directory: backend
        env:
          RLS_REQUIRED: "true"
          AUTH_MODE: jwt
          PYTHONPATH: .
        run: python ../scripts/prepare_ci_runtime.py
      - name: Backend tests including restricted-role RLS probes
        working-directory: backend
        run: |
          python -m pytest tests -v --junitxml=../pytest-ci.xml
          python -c "import xml.etree.ElementTree as E; assert not E.parse('../pytest-ci.xml').findall('.//testcase/skipped'), 'CI cannot skip security tests'"
      - name: Python vulnerability scan
        run: pip-audit --require-hashes -r backend/requirements.lock
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      - name: Scan complete Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@6eaad039603a4de39fddd1cf5f727391efe9974e git --redact --log-opts=--all
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests build and vulnerability scan
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
          git diff --exit-code -- package-lock.json
