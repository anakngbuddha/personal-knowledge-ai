name: Test Suite & Multi-Tenant Isolation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend Tests & Security Baseline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: pka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Initialize Database & Run Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/pka_test
          EMBEDDING_PROVIDER: fake
          STORAGE_BACKEND: local
        run: |
          cd backend
          python ../scripts/init_db.py

      - name: Run Backend Test Suite (including RLS & isolation)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/pka_test
          EMBEDDING_PROVIDER: fake
          STORAGE_BACKEND: local
          AUTH_MODE: owner_dev
        run: |
          python -m pytest backend/tests -v
